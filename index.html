<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop acc liqi - Duyệt và xem tài khoản game.">
    <title>Shop Acc Liqi</title>

    <link rel="icon" type="image/png" href="https://res.cloudinary.com/zv0jlmxj/image/upload/v1787241826/96477251-8c82-4f3f-a032-8719e420fb94.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Spectral:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="brand">
            <div class="brand-title">
                <img class="logo" src="https://res.cloudinary.com/zv0jlmxj/image/upload/v1787241826/96477251-8c82-4f3f-a032-8719e420fb94.png" alt="Logo Shop Acc Liqi">
                <h1>Shop acc liqi</h1>
            </div>
            <p class="tagline">Danh sách tài khoản & skin</p>
        </div>

        <div class="header-actions">
            <!-- Nút Thêm dành riêng cho Admin (Mặc định ẩn) -->
            <button id="add-acc-btn" class="btn btn-primary admin-only hidden">+ Thêm Acc Mới</button>
            
            <div class="search-box">
                <label for="search" class="visually-hidden">Tìm kiếm</label>
                <input id="search" type="text" placeholder="🔍 Tìm kiếm acc hoặc skin..." autocomplete="off">
            </div>

            <!-- Khu vực Tài khoản / Đăng nhập -->
            <div id="auth-area">
                <button id="login-btn" class="btn btn-secondary">Đăng Nhập</button>
                <div id="user-info" class="user-info hidden">
                    <span id="user-display"></span>
                    <button id="logout-btn" class="btn btn-outline">Đăng xuất</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Danh sách acc -->
        <div id="grid" class="grid"></div>

        <!-- Phân trang -->
        <div id="pagination"></div>
    </main>

    <!-- Modal Xem Ảnh -->
    <div id="image-modal" class="modal" role="dialog" aria-hidden="true">
        <span id="modal-close" class="modal-close">&times;</span>
        <img id="modal-img" class="modal-content" src="" alt="Ảnh phóng to">
    </div>

    <!-- Modal Đăng Nhập -->
    <div id="login-modal" class="modal" role="dialog" aria-hidden="true">
        <div class="modal-card">
            <span id="login-modal-close" class="modal-close">&times;</span>
            <h2>Đăng Nhập Hệ Thống</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập *</label>
                    <input type="text" id="username" required placeholder="Nhập tên tài khoản (admin/user)">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu *</label>
                    <input type="password" id="password" required placeholder="Nhập mật khẩu">
                </div>
                <div class="login-hint">
                    <p>💡 <strong>Tài khoản thử nghiệm:</strong></p>
                    <p>• Admin: <code>admin</code> / <code>admin123</code> (Toàn quyền CRUD)</p>
                    <p>• User: <code>user</code> / <code>user123</code> (Chỉ xem/Dữ liệu riêng)</p>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Đăng nhập</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal CRUD (Thêm/Sửa Acc) -->
    <div id="crud-modal" class="modal" role="dialog" aria-hidden="true">
        <div class="modal-card">
            <span id="crud-modal-close" class="modal-close">&times;</span>
            <h2 id="modal-form-title">Thêm Tài Khoản Mới</h2>
            <form id="acc-form">
                <div class="form-group">
                    <label for="acc-title">Tên Tài Khoản / ID *</label>
                    <input type="text" id="acc-title" required placeholder="Ví dụ: kzreg.2529">
                </div>
                <div class="form-group">
                    <label for="acc-image">URL Hình Ảnh *</label>
                    <input type="url" id="acc-image" required placeholder="https://res.cloudinary.com/...">
                </div>
                <div class="form-group">
                    <label for="acc-skins">Danh sách Skins (mỗi skin một dòng)</label>
                    <textarea id="acc-skins" rows="4" placeholder="Ryoma samurai huyền thoại&#10;Zephyr kỷ nguyên hổ phách"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-form-btn" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
